<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diwali Desk · Chinki widget demo</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fbf7f0; color: #1a1a1a; }
      main { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
      .card { background: #fff; border: 1px solid #e6ded2; border-radius: 16px; padding: 24px; margin-top: 24px; }
      pre { background: #1a1a1a; color: #f5f5f5; padding: 16px; border-radius: 12px; overflow: auto; font-size: 13px; }
      #log { font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; }
      small { color: #6b6257; }
    </style>
  </head>
  <body>
    <main>
      <small>DIWALI DESK · TEAM PORTAL · DEMO HOST APP</small>
      <h1>Send your team a Diwali Chinki</h1>
      <p>This page is a separate app. It adds gifting with the snippet below and never touches a wallet or a key.</p>
      <div class="card">
        <div id="chinki"></div>
        <p id="log">Waiting for a gift…</p>
      </div>
      <div class="card">
        <strong>The whole integration</strong>
        <pre id="snippet"></pre>
      </div>
    </main>

    <!-- Chinki integration starts here -->
    <script src="http://localhost:3000/chinki.js"></script>
    <script id="integration">
      Chinki.button("#chinki", {
        app: "Diwali Desk",
        amount: "25",
        note: "Diwali bonus · Diwali Desk",
        campaign: "diwali-desk-2026",
        onGift(gift) {
          document.getElementById("log").textContent =
            `Gift ${gift.id.slice(0, 10)}… · $${gift.amount} · ${gift.status}\n` +
            `Receipt: ${gift.receiptUrl}`;
        },
        onClose() {
          console.log("Chinki window closed");
        },
      });
    </script>
    <!-- Chinki integration ends here -->

    <script>
      document.getElementById("snippet").textContent =
        '<div id="chinki"></div>\n<script src="http://localhost:3000/chinki.js"><\/script>\n<script>' +
        document.getElementById("integration").textContent + "<\/script>";
    </script>
  </body>
</html>
